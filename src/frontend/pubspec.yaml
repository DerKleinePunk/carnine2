name: carnine_frontend
description: Minimal Flutter bootstrap frontend for Carnine.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  clock: ^1.1.2
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  grpc: ^5.1.0
  protobuf: ^6.0.0
  logging: ^1.2.0
  window_manager: ^0.5.1
  characters: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  protoc_plugin: ^25.0.0
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-VF.otf
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-VF.otf
