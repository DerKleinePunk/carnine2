name: carnine_frontend
description: Minimal Flutter bootstrap frontend for Carnine.
publish_to: "none"
# Placeholder. The release version lives in /VERSION and reaches the bundle
# through build_pi.sh (--dart-define) and the package through package-deb.sh.
version: 0.1.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  clock: ^1.1.2
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  grpc: ^5.1.0
  protobuf: ^6.0.0
  logging: ^1.2.0
  window_manager: ^0.5.1
  characters: ^1.4.1
  # Entfernungen (Distance); dieselbe Version wie in local_map.
  latlong2: ^0.10.1
  # Offline-Karte (MBTiles, Navigationsmodus), eigenes Open-Source-Paket.
  # Die drei dependency_overrides unten sind Pflicht, siehe dessen README.
  local_map:
    git:
      url: https://github.com/DerKleinePunk/flutter_local_map.git
      # Feste Marke statt master: Aenderungen an der Lib kommen erst mit
      # einem bewussten Wechsel der Marke ins Auto.
      ref: local_map-v0.6.0
      path: packages/local_map
  # Rueckfahrkamera (USB-Grabber STK1160) als Platform View, eigenes Paket.
  # Braucht zur Laufzeit libvideo_grabber_view.so, die build_pi.sh mitbaut.
  video_grabber:
    git:
      url: https://github.com/DerKleinePunk/video_grabber.git
      # Fester Commit (messageBuilder, Dart-SDK ab 3.12, Bildbreite width,
      # USB-Kameras mit YUYV).
      ref: 3114ff6e9ec227f1976f93053005ff7b22f73a76

# Pflicht fuer local_map: Overrides wirken nicht transitiv. Forks mit
# einstellbarem panBuffer/rasterTileScale, mitdrehender Beschriftung
# (local_map 0.6.0) und mbtiles ^0.5.
dependency_overrides:
  vector_map_tiles:
    git:
      url: https://github.com/DerKleinePunk/flutter-vector-map-tiles
      # Fester Commit auf dem Zweig local_map_pi, passend zu local_map-v0.6.0
      # (rasterLabelRotationStep).
      ref: b870db815e8c63bfed8a963f0a8250c85525ddc1
  # Seit local_map 0.6.0 Pflicht: dreht Punkt- und Strassennamen mit.
  vector_tile_renderer:
    git:
      url: https://github.com/DerKleinePunk/dart-vector-tile-renderer
      # Fester Commit auf dem Zweig local_map_pi.
      ref: 3205e3ff87389fccbb985aeeec2445bd24a4346f
  flutter_map_mbtiles:
    git:
      url: https://github.com/DerKleinePunk/flutter_map_plugins
      ref: to_flutter_map_8
      path: flutter_map_mbtiles
  vector_map_tiles_mbtiles:
    git:
      url: https://github.com/DerKleinePunk/flutter_map_plugins
      ref: to_flutter_map_8
      path: vector_map_tiles_mbtiles
  # vector_tile_renderer verlangt vector_tile ^2 (protobuf ^3), gRPC braucht
  # protobuf ^6. vector_tile 4.0.0 ist laut Changelog nur fuer protobuf 6 neu
  # generiert, die API ist unveraendert.
  vector_tile: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  protoc_plugin: ^25.0.0
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    # Dunkler Kartenstyle fuer local_map (MapConfig.vectorStyleAssets).
    - assets/maps/style_carnine_dark.json
    # SIL OFL 1.1 verlangt, dass die Lizenz mit den Schriften ausgeliefert wird.
    - assets/fonts/OFL-Manrope.txt
    - assets/fonts/OFL-SpaceGrotesk.txt
  fonts:
    # Designschriften (docs/stitch_car_pc/aether_drive/DESIGN.md). Statische
    # Schnitte aus den Variable Fonts von google/fonts, weil der Pi sie nicht
    # installiert hat und Noto SC/JP kein Latin Extended-A abdeckt (#40).
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-VF.otf
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-VF.otf
