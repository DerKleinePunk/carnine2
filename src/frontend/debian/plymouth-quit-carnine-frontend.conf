# Part of carnine-frontend: the boot logo stays until the frontend shows its
# first frame (it calls `plymouth deactivate` before it takes the display), so
# there is no black screen in between. --retain-splash leaves the logo on the
# panel until the frontend draws over it.
[Unit]
After=carnine-frontend.service

[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
