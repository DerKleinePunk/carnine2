# Texts of the expert page (#217) in the languages of the interface.
#
# German is the source and stays in `install_settings::SCHEMA`; this file
# has every other language the frontend offers. Per language: the group
# headings (by the first part of the key), then per setting its label, help
# and the labels of its choices (by choice value). A test checks that every
# language has every text of the schema and nothing else.
#
# Terms follow the frontend's own translations (src/frontend/lib/l10n):
# e.g. "System default" for an empty output, "Reverse gear" for the camera.

[en.groups]
reverse_gear = "Reverse gear"
audio = "Sound output"
power_supply = "Power supply"

[en."reverse_gear.source"]
label = "Source"
help = "Where the backend reads the reverse gear from."
choices = { none = "none", gpio = "GPIO input", demo = "Demonstration (via gRPC)" }

[en."reverse_gear.gpio_chip"]
label = "GPIO chip"
help = "Device file of the GPIO chip, /dev/gpiochip0 on the Raspberry Pi."

[en."reverse_gear.gpio_line"]
label = "GPIO line"
help = "Number of the line on the chip, e.g. 26 for GPIO 26. Needed with source GPIO."

[en."reverse_gear.active_low"]
label = "Active at ground"
help = "The gear is in when the line is at ground (optocoupler)."

[en."reverse_gear.bias"]
label = "Resistor"
help = "Pull resistor at the input."
choices = { pull_up = "Pull-up (to 3.3 V)", pull_down = "Pull-down (to ground)", none = "none" }

[en."reverse_gear.debounce_ms"]
label = "Debounce"
help = "Shorter changes are ignored. 0 turns it off."

[en."audio.output_card"]
label = "Output"
help = "Sound card the speakers are connected to. Empty: system default. Leave empty with the AC-3 encoder image."

[en."audio.mixer_control"]
label = "Volume control"
help = "Mixer control of the card the volume is set on."

[en."audio.channels"]
label = "Channels"
help = "4 or 6 feed rear speakers. Empty: the device's default (stereo)."
choices = { 2 = "2 (stereo)", 4 = "4", 6 = "6 (5.1)" }

[en."audio.rear_percent"]
label = "Rear level"
help = "Volume of the rear speakers relative to the front."

[en."power_supply.enabled"]
label = "Power supply connected"
help = "The backend talks to the car power supply on the serial port."

[en."power_supply.amplifier_relay"]
label = "Amplifier via relay 3"
help = "Relay 3 switches the amplifier's remote turn-on (REM)."

[en."power_supply.shutdown_on_poweroff"]
label = "Shut down with the ignition"
help = "Off if the Pi on the bench should stay on with the ignition off."

