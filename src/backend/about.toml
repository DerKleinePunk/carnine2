# Licences of the crates linked into the shipped binary. build_pi.sh and
# build_linux.sh write them with `cargo about generate --target …` into the
# package (#123).
# A crate under a licence not listed here stops the build until someone looks at it.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Our own crate; for the dependencies a copyleft licence should still stop the build.
[carnine-backend]
accepted = ["GPL-3.0-only"]
