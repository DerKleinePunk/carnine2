[package]
name = "carnine-backend"
# Placeholder. The release version lives in /VERSION and reaches the binary
# through build.rs and the package through `cargo deb --deb-version`.
version = "0.1.0"
edition = "2021"
description = "Backend service for Carnine"
authors = ["Carnine Project"]
license = "GPL-3.0-only"

[package.metadata.deb]
section = "utils"
priority = "optional"
maintainer = "Carnine Project"
copyright = "Copyright 2026 Carnine Project"
depends = "$auto, ffmpeg, libasound2t64, alsa-utils, udisks2"
extended-description = "Carnine backend service providing the gRPC interface for vehicle data and commands."
assets = [
	["target/release/carnine-backend", "usr/bin/carnine-backend", "755"],
	["debian/60-carnine-gps.rules", "lib/udev/rules.d/60-carnine-gps.rules", "644"],
	["debian/61-carnine-powersupply.rules", "lib/udev/rules.d/61-carnine-powersupply.rules", "644"],
]
maintainer-scripts = "debian/"
systemd-units = { enable = true, start = true }

[features]
direct-ffmpeg-library-spike = ["dep:ffmpeg-next"]

[[example]]
name = "direct_ffmpeg_library_spike"
required-features = ["direct-ffmpeg-library-spike"]

[[example]]
name = "cpal_audio_spike"

[[example]]
name = "cpal_decoder_spike"
required-features = ["direct-ffmpeg-library-spike"]

[[example]]
name = "cpal_external_decoder_spike"

[[example]]
name = "cpal_mixer_spike"

[[example]]
name = "cpal_source_mixer_spike"

[[example]]
name = "cpal_engine_adapter_spike"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
cpal = "0.16"
futures-util = "0.3"
# statvfs for the disk usage in system_metrics; std exposes no free-space API.
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1.38", features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zbus = "5"
tonic = "0.12"
# HTTP client for the local Valhalla service (ADR-021). Already in the tree
# through tonic; plain http only, the router listens on loopback.
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
prost = "0.13"
ringbuf = "0.4"
ffmpeg-next = { version = "8", optional = true }
rand = "0.8"

[dev-dependencies]
# test-util gives the metrics sampler tests a paused clock, so they cover the
# tick scheduling without sleeping for real.
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "test-util"] }

[build-dependencies]
tonic-build = "0.12"
