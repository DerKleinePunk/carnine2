syntax = "proto3";

package carnine;

service CarnineService {
  rpc GetCanData (CanDataRequest) returns (CanDataResponse);
}

service MediaService {
  rpc GetServiceVersion (Empty) returns (ServiceVersion);
  rpc Play (PlayRequest) returns (CommandResponse);
  rpc Pause (Empty) returns (CommandResponse);
  rpc Stop (Empty) returns (CommandResponse);
  rpc Next (Empty) returns (CommandResponse);
  rpc Previous (Empty) returns (CommandResponse);
  // Moves the current track by delta_ms, relative to where it is now; the
  // queue stays. Stops at the start and at a known end; a paused track stays
  // paused. FAILED_PRECONDITION without a loaded track.
  rpc Seek (SeekRequest) returns (CommandResponse);
  rpc RestartCurrentTrack (Empty) returns (CommandResponse);
  rpc PlayQueueEntry (PlayQueueEntryRequest) returns (CommandResponse);
  rpc PlayPlaylist (PlayPlaylistRequest) returns (CommandResponse);
  rpc GetPlayerState (Empty) returns (PlayerState);
  rpc SearchMedia (SearchMediaRequest) returns (SearchMediaResponse);
  rpc ImportMusicVolume (ImportMusicVolumeRequest) returns (stream LibraryEvent);
  rpc RescanMedia (RescanMediaRequest) returns (stream LibraryEvent);
  rpc StreamLibraryEvents (Empty) returns (stream LibraryEvent);
  rpc CreatePlaylist (CreatePlaylistRequest) returns (Playlist);
  rpc ListPlaylists (Empty) returns (ListPlaylistsResponse);
  rpc AddPlaylistEntry (AddPlaylistEntryRequest) returns (PlaylistEntry);
  rpc GetPlaylist (GetPlaylistRequest) returns (Playlist);
  // A new name for the playlist, trimmed like CreatePlaylist. INVALID_ARGUMENT
  // for an empty name, ALREADY_EXISTS when another playlist has it,
  // NOT_FOUND for an unknown id. Returns the playlist without its entries.
  rpc RenamePlaylist (RenamePlaylistRequest) returns (Playlist);
  // Deletes the playlist with its entries. If it is the one loaded, the
  // current track plays on as a loose track. NOT_FOUND for an unknown id.
  rpc DeletePlaylist (DeletePlaylistRequest) returns (Empty);
  // Takes one entry out of its playlist; the entries after it move up, so
  // positions stay 0..n-1. If the playlist is loaded, its queue follows; for
  // the current track the player goes on to the following one, in the same
  // state (playing or paused), or stops when none follows. Returns the
  // playlist as it is now. NOT_FOUND for an unknown entry id.
  rpc RemovePlaylistEntry (RemovePlaylistEntryRequest) returns (Playlist);
  rpc StreamPlayerEvents (Empty) returns (stream PlayerEvent);
  rpc GetCoverArt (GetCoverArtRequest) returns (GetCoverArtResponse);
  rpc SetRepeatMode (SetRepeatModeRequest) returns (CommandResponse);
  rpc SetShuffleMode (SetShuffleModeRequest) returns (CommandResponse);
}

service AudioService {
  rpc GetServiceVersion (Empty) returns (ServiceVersion);
  rpc GetVolume (Empty) returns (VolumeResponse);
  rpc SetVolume (SetVolumeRequest) returns (VolumeResponse);
  rpc StreamAudioEvents (Empty) returns (stream AudioEvent);
}

service ConfigService {
  rpc GetConfiguration (Empty) returns (Configuration);
  rpc UpdateConfiguration (UpdateConfigurationRequest) returns (ConfigurationResponse);
}

service SystemService {
  rpc ReportUiReady (Empty) returns (CommandResponse);
  // Latest sampled health snapshot. Answered from the sampler's cache, so
  // calling this never triggers a read of /proc or /sys.
  rpc GetSystemMetrics (Empty) returns (SystemMetrics);
  // Pushes a snapshot on every CPU sample (system.metrics_interval_seconds),
  // starting with the current one.
  rpc StreamSystemMetrics (Empty) returns (stream SystemMetrics);
  // Whether the CPU is too hot (#70). The backend decides, with hysteresis
  // (system.cpu_temperature_warn_celsius / _clear_celsius), so every UI
  // agrees. Absent a thermal zone (e.g. WSL) it never reports overheated.
  rpc GetThermalStatus (Empty) returns (ThermalStatus);
  // Starts with the current status, then pushes one on every change.
  rpc StreamThermalStatus (Empty) returns (stream ThermalStatus);
  // What the car power supply (AuPrV1_1, docs/23-power-supply.md) last
  // reported. Answers with configured = false on a device without one.
  rpc GetPowerSupplyStatus (Empty) returns (PowerSupplyStatus);
  // Starts with the current status, then pushes one on every change of
  // connection, ignition, state or input voltage.
  rpc StreamPowerSupplyStatus (Empty) returns (stream PowerSupplyStatus);
  // What the UI keeps across restarts, stored in the media database next to
  // the resume state. Unknown values are the UI's to ignore.
  rpc GetUiState (Empty) returns (UiState);
  rpc SaveUiState (UiState) returns (CommandResponse);
  // The password "Beenden" in the options asks for (#51). The backend keeps
  // only an Argon2id hash: the factory default from the configuration, a
  // changed one in /etc/carnine/config.d/30-exit-password.toml. Verify
  // answers valid = false for a wrong password; it is not an error.
  rpc VerifyExitPassword (ExitPasswordRequest) returns (ExitPasswordCheck);
  // Needs the current password. PERMISSION_DENIED when it is wrong,
  // INVALID_ARGUMENT when the new one breaks the rules (4 to 64 characters,
  // no control characters), INTERNAL when it cannot be stored. The new
  // password counts at once and survives restarts and deployments.
  rpc SetExitPassword (SetExitPasswordRequest) returns (CommandResponse);
  // Display backlight over a PWM channel (`[display.backlight]`, a display
  // modified for it). Answers with configured = false without one. The
  // level survives restarts; percent 0 is the dimmest the configuration
  // allows (min_percent), never dark.
  rpc GetDisplayBrightness (Empty) returns (DisplayBrightness);
  // INVALID_ARGUMENT above 100, FAILED_PRECONDITION without a backlight,
  // UNAVAILABLE when the PWM channel cannot be driven.
  rpc SetDisplayBrightness (SetDisplayBrightnessRequest) returns (DisplayBrightness);
}

message DisplayBrightness {
  bool configured = 1;
  // False while the PWM channel cannot be driven (no overlay, no chip).
  bool available = 2;
  uint32 percent = 3;  // 0 to 100
}

message SetDisplayBrightnessRequest {
  uint32 percent = 1;  // 0 to 100
}

message ExitPasswordRequest {
  string password = 1;
}

message ExitPasswordCheck {
  bool valid = 1;
}

message SetExitPasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message UiState {
  // Dashboard page shown last, by its name (e.g. "maps"); empty when none
  // was saved yet. SaveUiState writes only the fields that are set, so a
  // page save keeps the language and the other way round; an empty value
  // that is set clears it.
  optional string last_page = 1;
  // Display language chosen last, as its code (e.g. "de"); empty when none
  // was saved yet (#30).
  optional string language = 2;
}

// Routing, own position and place search for the navigation page (ADR-021).
// Units are SI; failures are gRPC status codes: UNAVAILABLE (router down),
// NOT_FOUND (no route, or no replay running), FAILED_PRECONDITION (no origin
// given and no fix), INVALID_ARGUMENT (bad coordinates).
service NavigationService {
  rpc GetServiceVersion (Empty) returns (ServiceVersion);
  rpc GetNavigationStatus (Empty) returns (NavigationStatus);
  rpc SearchPlaces (SearchPlacesRequest) returns (SearchPlacesResponse);
  // Street, locality and district at a position, for "where am I" without a
  // route. Empty fields when nothing is known there or the names database
  // predates September 2026; UNAVAILABLE without a names database.
  rpc GetLocationName (GetLocationNameRequest) returns (LocationName);
  rpc ComputeRoute (ComputeRouteRequest) returns (Route);
  // The route of the running NMEA replay, map-matched against the recorded
  // fixes, so position and route come from the same recording.
  rpc GetReplayRoute (GetReplayRouteRequest) returns (Route);
  // Fixes at the source's rate (1 Hz for NMEA), heading unsmoothed.
  rpc StreamPositions (Empty) returns (stream PositionFix);
  // Switches writing the GPS receiver's raw NMEA to a file in
  // navigation.track_directory, live and kept across restarts. Such a file
  // works as a replay_file. FAILED_PRECONDITION without a track directory.
  // Answers with the status after the change.
  rpc SetTrackRecording (SetTrackRecordingRequest) returns (NavigationStatus);
  // Spoken turn announcements. The map library sends the texts it may speak
  // for the next maneuver ahead, so the backend synthesizes them in the
  // background; Announce then speaks one, over the music. Both answer OK and
  // do nothing while speech is off or no voice is installed.
  rpc PrepareAnnouncements (PrepareAnnouncementsRequest) returns (Empty);
  rpc Announce (AnnounceRequest) returns (Empty);
  rpc GetVoiceSettings (Empty) returns (VoiceSettings);
  // Saved, so it survives a restart. Answers with the settings after the change.
  rpc SetVoiceSettings (SetVoiceSettingsRequest) returns (VoiceSettings);
  // Reserved for after the trade fair: StreamGuidance (progress, off-route).
}

// Settings of the reversing camera (video grabber on the camera page). The
// backend keeps them; the frontend reads them when it opens the camera and
// hands them to the grabber. Defaults come from [camera] in the
// configuration; what SaveCameraSettings stores overrides them.
service CameraService {
  // The settings in effect: every field is set.
  rpc GetCameraSettings (Empty) returns (CameraSettings);
  // Stores only the fields that are set and returns the settings in effect.
  // INVALID_ARGUMENT, and nothing stored, for a device outside /dev/video*
  // and /dev/v4l/, an unspecified norm, an input above 15 or a width other
  // than 360 or 720.
  rpc SaveCameraSettings (CameraSettings) returns (CameraSettings);
  // Video devices a camera can be on, for a choice in the settings: the
  // first node of each device, without the SoC's own codec, ISP and decoder
  // nodes (bcm2835-*, rpi-*).
  rpc ListCameraDevices (Empty) returns (ListCameraDevicesResponse);
}

message CanDataRequest {
  string sensor_id = 1;
}

message CanDataResponse {
  repeated CanData data = 1;
}

message CanData {
  string sensor_id = 1;
  double value = 2;
  int64 timestamp = 3;
}

message CommandResponse {
  bool success = 1;
  string message = 2;
}

message Empty {}

message ServiceVersion {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

message MediaId {
  uint64 value = 1;
}

message PlaylistEntryId {
  uint64 value = 1;
}

message QueueEntryId {
  uint64 value = 1;
}

message SourceId {
  uint64 value = 1;
}

message ScanId {
  uint64 value = 1;
}

message PlayRequest {
  string media_path = 1;
}

message SearchMediaRequest {
  string query = 1;
}

message SearchMediaResponse {
  repeated MediaItem items = 1;
}

message RescanMediaRequest {}

message ImportMusicVolumeRequest {
  string source_path = 1;
}

enum LibraryEventType {
  LIBRARY_EVENT_TYPE_UNSPECIFIED = 0;
  LIBRARY_SCAN_STARTED = 1;
  LIBRARY_PROGRESS = 2;
  LIBRARY_ERROR = 3;
  LIBRARY_SCAN_COMPLETED = 4;
  LIBRARY_MUSIC_FOUND = 5;
  LIBRARY_IMPORT_STARTED = 6;
  LIBRARY_IMPORT_PROGRESS = 7;
  LIBRARY_IMPORT_COMPLETED = 8;
  PLAYLIST_CREATED = 9;
  PLAYLIST_ENTRY_ADDED = 10;
  // A volume announced with LIBRARY_MUSIC_FOUND is no longer mounted;
  // source_path names it.
  LIBRARY_MUSIC_GONE = 11;
  // ffprobe/ffmpeg cannot be started: scans import file names only, without
  // artist, duration and cover. Sent after LIBRARY_SCAN_STARTED, and replayed
  // to new subscribers while the last check failed.
  LIBRARY_METADATA_TOOL_MISSING = 12;
  // playlist_id and the new playlist_name.
  PLAYLIST_RENAMED = 13;
  // playlist_id names the playlist that is gone.
  PLAYLIST_DELETED = 14;
  // playlist_id names the playlist that lost an entry.
  PLAYLIST_ENTRY_REMOVED = 15;
}

message LibraryEvent {
  LibraryEventType event = 1;
  uint64 scan_id = 2;
  uint64 processed = 3;
  uint64 imported = 4;
  string path = 5;
  string message = 6;
  string source_label = 7;
  string source_path = 8;
  uint64 matching_files = 9;
  uint64 playlist_id = 10;
  string playlist_name = 11;
}

message MediaItem {
  uint64 id = 1;
  uint64 source_id = 2;
  string path = 3;
  string title = 4;
  string artist = 5;
  int64 duration_ms = 6;
  string status = 7;
  bool has_cover_art = 8;
}

message Playlist {
  uint64 id = 1;
  string name = 2;
  repeated PlaylistEntry entries = 3;
  bool has_cover_art = 4;
}

message GetCoverArtRequest {
  oneof target {
    uint64 media_id = 1;
    uint64 playlist_id = 2;
  }
}

message GetCoverArtResponse {
  bytes data = 1;
  string mime_type = 2;
}

message PlaylistEntry {
  uint64 id = 1;
  uint64 playlist_id = 2;
  uint64 media_id = 3;
  uint64 position = 4;
}

message PlayPlaylistRequest {
  uint64 playlist_id = 1;
}

message SeekRequest {
  int64 delta_ms = 1;
}

message PlayQueueEntryRequest {
  uint32 index = 1;
}

message CreatePlaylistRequest {
  string name = 1;
}

message ListPlaylistsResponse {
  repeated Playlist playlists = 1;
}

message AddPlaylistEntryRequest {
  uint64 playlist_id = 1;
  uint64 media_id = 2;
}

message GetPlaylistRequest {
  uint64 playlist_id = 1;
}

message RenamePlaylistRequest {
  uint64 playlist_id = 1;
  string name = 2;
}

message DeletePlaylistRequest {
  uint64 playlist_id = 1;
}

message RemovePlaylistEntryRequest {
  uint64 entry_id = 1;
}

message PlayerState {
  string status = 1;
  string media_path = 2;
  int64 position_ms = 3;
  int64 duration_ms = 4;
  uint64 playlist_id = 5;
  RepeatMode repeat_mode = 6;
  bool shuffle_enabled = 7;
}

message PlayerEvent {
  PlayerEventType event = 1;
  PlayerState state = 2;
  string message = 3;
}

enum PlayerEventType {
  PLAYER_EVENT_TYPE_UNSPECIFIED = 0;
  PLAYER_SNAPSHOT = 1;
  PLAYER_POSITION_CHANGED = 2;
  PLAYER_PLAYBACK_STARTED = 3;
  PLAYER_RESUMED = 4;
  PLAYER_PAUSED = 5;
  PLAYER_STOPPED = 6;
  PLAYER_TRACK_CHANGED = 7;
  PLAYER_ERROR = 8;
  PLAYER_QUEUE_FINISHED = 9;
}

enum RepeatMode {
  REPEAT_MODE_UNSPECIFIED = 0;
  REPEAT_OFF = 1;
  REPEAT_QUEUE = 2;
  REPEAT_TRACK = 3;
}

message SetRepeatModeRequest {
  RepeatMode mode = 1;
}

message SetShuffleModeRequest {
  bool enabled = 1;
}

enum AudioEventType {
  AUDIO_EVENT_TYPE_UNSPECIFIED = 0;
  AUDIO_READY = 1;
  AUDIO_SOURCE_STARTED = 2;
  AUDIO_SOURCE_PAUSE_REQUESTED = 3;
  AUDIO_SOURCE_RESUME_REQUESTED = 4;
  AUDIO_SOURCE_STOP_REQUESTED = 5;
  AUDIO_DECODER_STOPPED = 6;
  AUDIO_SOURCE_REMOVED = 7;
  AUDIO_DEVICE_CHANGED = 8;
  AUDIO_ERROR = 9;
  // No output device to play on (#56): the backend runs on without sound.
  // A newly opened stream starts with this instead of AUDIO_READY. It stays
  // so until AUDIO_OUTPUT_AVAILABLE - a UI shows it for as long.
  AUDIO_OUTPUT_UNAVAILABLE = 10;
  // The output opened again, on the next start after it was missing.
  AUDIO_OUTPUT_AVAILABLE = 11;
}

message AudioEvent {
  AudioEventType event = 1;
  string message = 2;
}

message SetVolumeRequest {
  uint32 percent = 1;
}

message VolumeResponse {
  uint32 percent = 1;
}

message Configuration {
  string socket_path = 1;
  string database_path = 2;
  repeated string media_folders = 3;
  repeated string supported_formats = 4;
  bool rescan_on_start = 5;
  string resume_mode = 6;
  // 11 was navigation_interrupt: never evaluated, removed 2026-10-10; the
  // music goes down to [voice] music_under_percent during announcements.
  reserved 11;
  reserved "navigation_interrupt";
  string log_directory = 12;
  string log_level = 13;
  string cover_cache_dir = 14;
  // Optional TCP loopback fallback (ADR-002); empty means unset. Must stay
  // unset in production - see docs/07-deployment.md §7.4.
  string tcp_address = 15;
  // Octal socket permissions such as "0660"; empty means the production
  // default 0600. See docs/07-deployment.md §7.4.
  string socket_mode = 19;
  // Health sampling, see SystemService.GetSystemMetrics.
  uint64 metrics_interval_seconds = 16;
  uint64 disk_metrics_interval_seconds = 17;
  // Empty means the default: root filesystem plus every media folder.
  repeated string disk_paths = 18;
}

message UpdateConfigurationRequest {
  Configuration configuration = 1;
}

message ConfigurationResponse {
  bool success = 1;
  string message = 2;
  Configuration configuration = 3;
  bool restart_required = 4;
}

message DiskUsage {
  // Path that was probed, as configured in system.disk_paths.
  string path = 1;
  // Mount point the path resolves to; several configured paths can share one.
  string mount_point = 2;
  uint64 total_bytes = 3;
  uint64 available_bytes = 4;
  double used_percent = 5;
}

message SystemMetrics {
  // CPU package temperature. Absent when the board exposes no thermal zone.
  optional double cpu_temperature_celsius = 1;
  // CPU utilisation across all cores between the last two samples, 0..100.
  // Absent for the very first sample, which has no predecessor to diff.
  optional double cpu_usage_percent = 2;
  double load_average_1m = 3;
  double load_average_5m = 4;
  double load_average_15m = 5;
  uint32 cpu_count = 6;
  uint64 uptime_seconds = 7;
  // When the CPU values above were sampled.
  int64 sampled_at_unix_ms = 8;
  // Disk usage is sampled on its own, slower cadence
  // (system.disk_metrics_interval_seconds), so it carries its own timestamp
  // and repeats unchanged across several CPU samples.
  repeated DiskUsage disks = 9;
  int64 disks_sampled_at_unix_ms = 10;
}

message ThermalStatus {
  // Set at warn_celsius, cleared only once below clear_celsius again.
  bool overheated = 1;
  // The reading that caused the last change. Absent without a thermal zone.
  optional double cpu_temperature_celsius = 2;
  double warn_celsius = 3;
  double clear_celsius = 4;
  // When overheated last changed; 0 while it never has.
  int64 changed_at_unix_ms = 5;
}

// The power supply's state machine (STATE_* in firmware/powersupply/).
enum PowerSupplyState {
  POWER_SUPPLY_STATE_UNSPECIFIED = 0;
  // Everything off, waiting for the ignition.
  POWER_SUPPLY_STATE_IDLE = 1;
  // Display and HDMI splitter on, power-on delay running.
  POWER_SUPPLY_STATE_POWER_ON = 2;
  // The Pi has power and time to boot; the watchdog does not count yet.
  POWER_SUPPLY_STATE_PI_BOOT = 3;
  // Normal operation; the watchdog counts.
  POWER_SUPPLY_STATE_RUN = 4;
  // Ignition off (or the watchdog fired): amplifier off, the Pi's power goes
  // off when the supply's timer runs out.
  POWER_SUPPLY_STATE_POWER_OFF = 5;
}

message PowerSupplyStatus {
  // power_supply.enabled in the configuration. Without it every other field
  // stays unset.
  bool configured = 1;
  // The supply sent a telegram within the last three seconds.
  bool connected = 2;
  // Ignition (KL15). Absent until the supply has reported it.
  optional bool ignition = 3;
  PowerSupplyState state = 4;
  optional double input_voltage_volts = 5;
  // The watchdog's alive counter, 0..3; in RUN normally 2.
  optional uint32 alive_count = 6;
}

message LatLon {
  double latitude = 1;   // WGS84 degrees
  double longitude = 2;
}

enum FixState {
  FIX_STATE_UNSPECIFIED = 0;
  // Source is alive but has no valid position; PositionFix.location is unset.
  FIX_STATE_NO_FIX = 1;
  FIX_STATE_FIX = 2;
}

enum PositionSourceKind {
  POSITION_SOURCE_KIND_UNSPECIFIED = 0;
  POSITION_SOURCE_NONE = 1;    // nothing configured, or the device is missing
  POSITION_SOURCE_SERIAL = 2;  // GPS mouse, NMEA over USB/serial
  POSITION_SOURCE_REPLAY = 3;  // recorded NMEA tour (trade fair, tests)
}

message PositionFix {
  FixState fix_state = 1;
  LatLon location = 2;
  // Course over ground, 0 = north, clockwise. Raw: the map smooths it and
  // freezes it at standstill, smoothing here as well would lag behind turns.
  optional double heading_degrees = 3;
  optional double speed_mps = 4;
  optional double accuracy_meters = 5;  // estimated from HDOP when present
  // GPS time from the fix, not the Pi's clock (no RTC).
  optional int64 timestamp_utc_ms = 6;
  PositionSourceKind source = 7;
}

message NavigationStatus {
  bool routing_available = 1;
  PositionSourceKind position_source = 2;
  FixState fix_state = 3;
  string map_region = 4;  // e.g. "hessen", for display and plausibility checks
  // A track directory is configured, so SetTrackRecording can be used.
  bool track_recording_available = 5;
  // Recording is switched on. Only the serial source writes anything.
  bool track_recording_enabled = 6;
  // File being written right now; empty while nothing is written.
  string track_file = 7;
  // Round of the replay tour now driving, from 1; 0 without a replay. Rises
  // by one each time the tour starts again, so a map that dropped the
  // tour's route can take it up with the next round (trade fair mode, #126).
  uint32 replay_lap = 8;
  // Trade fair mode ([navigation] demo_mode): the frontend goes back to the
  // map after 60 s without a touch (#128).
  bool demo_mode = 9;
}

message SetTrackRecordingRequest {
  bool enabled = 1;
}

enum PlaceType {
  PLACE_TYPE_UNSPECIFIED = 0;
  PLACE_TYPE_PLACE = 1;
  PLACE_TYPE_POI = 2;
  PLACE_TYPE_MOUNTAIN_PEAK = 3;
  PLACE_TYPE_WATER_NAME = 4;
  PLACE_TYPE_TRANSPORTATION_NAME = 5;
}

message Place {
  string name = 1;
  LatLon location = 2;
  uint32 zoom = 3;  // suggested zoom level to jump to
  PlaceType type = 4;
  optional string detail = 5;
  // Locality the hit belongs to ("Hauptstraße" in "Alsfeld"; for a place the
  // larger one nearby). Unset for regions and with older names databases.
  optional string area = 6;
}

message SearchPlacesRequest {
  string query = 1;
  uint32 limit = 2;          // 0 = default (15)
  optional LatLon near = 3;  // rank nearby hits first; may be ignored in v1
}

message SearchPlacesResponse {
  repeated Place places = 1;
}

message GetLocationNameRequest {
  optional LatLon position = 1;  // unset = the backend's current fix
}

message LocationName {
  optional string street = 1;    // nearest street, on motorways often "A 5"
  optional string locality = 2;  // city, municipality or village
  optional string district = 3;  // quarter nearby, if named otherwise
}

message ComputeRouteRequest {
  optional LatLon origin = 1;  // unset = the backend's current fix
  LatLon destination = 2;
  reserved 3;                  // via points, after the trade fair
  optional string language = 4;  // BCP-47 for instructions; unset = "de-DE"
  // Course at the origin, 0 = north, clockwise. Valhalla then starts on a
  // road leaving that way (±45°) instead of sending a driver who left the
  // route back to turn. Unset with origin unset: the course of the
  // backend's own fix while it moves.
  optional double origin_heading_degrees = 5;
}

message GetReplayRouteRequest {
  optional string language = 1;  // BCP-47 for instructions; unset = "de-DE"
}

message Maneuver {
  string instruction = 1;
  double length_meters = 2;
  double time_seconds = 3;
  uint32 type = 4;               // Valhalla maneuver type, passed through
  uint32 begin_shape_index = 5;  // index into Route.geometry, continuous across legs
  repeated string street_names = 6;
  // Valhalla's spoken texts in the route's language, ready for speech
  // output: the alert before the maneuver (verbal_transition_alert_instruction),
  // the one at it (verbal_pre_transition_instruction) and the one after it
  // (verbal_post_transition_instruction). Absent when Valhalla gives none.
  optional string verbal_alert = 7;
  optional string verbal_pre = 8;
  optional string verbal_post = 9;
}

// A turn instruction cuts an information short; an information never
// interrupts a turn instruction.
enum AnnouncementPriority {
  ANNOUNCEMENT_PRIORITY_UNSPECIFIED = 0;  // treated as MANEUVER
  ANNOUNCEMENT_PRIORITY_MANEUVER = 1;
  ANNOUNCEMENT_PRIORITY_INFO = 2;         // e.g. "Die Route wird neu berechnet."
}

message PrepareAnnouncementsRequest {
  // Spoken exactly as given; Announce finds them by the same text.
  repeated string texts = 1;
}

message AnnounceRequest {
  string text = 1;
  AnnouncementPriority priority = 2;
}

message VoiceSettings {
  // A voice is installed and loaded; without one the switch does nothing.
  bool available = 1;
  bool enabled = 2;
  uint32 volume_percent = 3;  // 0-100
  string voice = 4;           // e.g. "thorsten-medium"
  // The music's level while a sentence plays, 0-100 (100 = not turned down).
  // Saved like the others; until set, [voice] music_under_percent.
  uint32 music_under_percent = 5;
}

message SetVoiceSettingsRequest {
  optional bool enabled = 1;
  optional uint32 volume_percent = 2;  // 0-100; above is INVALID_ARGUMENT
  optional uint32 music_under_percent = 3;  // 0-100; above is INVALID_ARGUMENT
}

message Route {
  string route_id = 1;
  repeated LatLon geometry = 2;
  double distance_meters = 3;
  double duration_seconds = 4;
  repeated Maneuver maneuvers = 5;
  // Where the route ends, for the search field; set on the replay route
  // ([navigation] replay_destination_name, else street and locality from
  // the names database), empty otherwise (#127).
  string destination_name = 6;
}

// Video norm of the camera signal.
enum CameraNorm {
  CAMERA_NORM_UNSPECIFIED = 0;
  CAMERA_NORM_NTSC = 1;
  CAMERA_NORM_PAL = 2;
}

message CameraSettings {
  // Video device, e.g. "/dev/video0".
  optional string device = 1;
  optional CameraNorm norm = 2;
  // Input of the grabber; on the STK1160 0-3 are composite 0-3, 4 S-Video.
  optional uint32 input = 3;
  // Picture width from the grabber, 360 or 720. At 720 the STK1160 fills
  // USB 2 and about two thirds of the frames come incomplete; 360 brings
  // all 30 per second.
  optional uint32 width = 4;
}

message CameraDevice {
  // Device node, e.g. "/dev/video0".
  string path = 1;
  // The driver's name for it, e.g. "stk1160".
  string name = 2;
  // The kernel driver bound to it, e.g. "stk1160" for the grabber or
  // "uvcvideo" for a USB camera; empty when sysfs does not say. A USB camera
  // takes neither norm, input nor width, so the UI can grey them out.
  string driver = 3;
}

message ListCameraDevicesResponse {
  repeated CameraDevice devices = 1;
}

// Switches and sliders on the "Technik" page, driven over I2C. What an id
// means in hardware (chip, address, pin) lives only in the backend
// configuration ([[controls]]); the UI only knows what this service tells
// it. Without hardware (WSL) the "demo" chip stands in and simply keeps
// what is set.
service ControlService {
  // Every configured control, in the order the configuration lists them.
  // Empty when none is configured: the page then has nothing to operate.
  rpc GetControls (Empty) returns (ControlList);
  // Starts with the state of every control, then pushes one ControlState
  // per change - also one made by another client or by the backend itself
  // (the chip went missing or came back).
  rpc StreamControlStates (Empty) returns (stream ControlState);
  // Sets one control and answers with the state that now applies.
  // NOT_FOUND for an unknown id, INVALID_ARGUMENT for a value that does not
  // fit the type (a level for a switch, a level outside min..max),
  // UNAVAILABLE when the chip does not answer.
  rpc SetControlState (SetControlStateRequest) returns (ControlState);
}

enum ControlType {
  CONTROL_TYPE_UNSPECIFIED = 0;
  // On / off.
  CONTROL_TYPE_SWITCH = 1;
  // A level between min and max.
  CONTROL_TYPE_SLIDER = 2;
}

message Control {
  // Stable identifier from the configuration, e.g. "interior_light".
  string id = 1;
  // What the user named it in the configuration, e.g. "Innenlicht". Shown
  // as it is, never translated.
  string name = 2;
  ControlType type = 3;
  // Sliders only: the range of level, 0 to 100.
  uint32 min = 4;
  uint32 max = 5;
}

message ControlList {
  repeated Control controls = 1;
}

message ControlState {
  string id = 1;
  oneof value {
    // SWITCH.
    bool on = 2;
    // SLIDER, min..max.
    uint32 level = 3;
  }
  // False while the chip behind this control does not answer; the UI shows
  // the control greyed out. The value is the last one that was set.
  bool available = 4;
}

message SetControlStateRequest {
  string id = 1;
  oneof value {
    bool on = 2;
    uint32 level = 3;
  }
}
