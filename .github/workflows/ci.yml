name: CI

# carnine2 is a public repository, so every job here runs on GitHub-hosted
# standard runners at no cost - including the native arm64 runner. Keep it that
# way: no self-hosted runners on a public repository, and no image build (debos
# needs privileged podman and KVM) or hardware test (panel, car radio, USB) in
# CI. Those stay on the developer machine and on the test Pi.

on:
  push:
    # Every branch, not just the long-lived ones: a branch that falls outside
    # the pattern gets no CI at all, and nothing tells you that it did not run.
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the running job pointless - cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (format, clippy, tests)
    runs-on: ubuntu-24.04
    # A hung step (e.g. apt-get on the runner, 2026-10-07) ends here, not after
    # GitHub's 6 h; the longest job takes about 3 min.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The demo tools' own tests, a second or so. Python ships with the runner
      # image, and a step here saves the start of a job of their own.
      - name: Demo tool tests (Python)
        working-directory: resources/tools/demo
        run: python3 -m unittest -v test_demo_gps.py

      # protoc for tonic-prost-build, ALSA headers for cpal. The default feature set
      # does not pull in ffmpeg-next, so no FFmpeg headers are needed - but the
      # metadata and cover-art tests shell out to the ffmpeg and ffprobe
      # binaries, which the runner image does not ship.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            protobuf-compiler libasound2-dev ffmpeg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/backend

      - name: cargo fmt
        working-directory: src/backend
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src/backend
        run: cargo clippy --all-targets -- -D warnings

      # Config::load_with_env keeps these hermetic, but an empty environment
      # documents the intent for anyone reading the log.
      - name: cargo test
        working-directory: src/backend
        run: cargo test

  frontend:
    name: Frontend (analyze, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Pinned to the Flutter of the emb workspace the Pi build uses
      # (docs/07-deployment.md, src/frontend/CLAUDE.md), so CI checks what
      # runs on the device and a new release cannot turn CI red on its own.
      # Raise it together with the emb workspace.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: src/frontend
        run: flutter pub get

      - name: flutter analyze
        working-directory: src/frontend
        run: flutter analyze

      - name: flutter test
        working-directory: src/frontend
        run: flutter test

  image-scripts:
    name: Image scripts (shellcheck, tests)
    # The first-boot scripts run on the Pi, but their logic is plain shell and
    # testable on a scratch tree - no image build needed (see the note above).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        working-directory: resources/debos
        run: shellcheck carnine-hostname.sh tests/carnine-hostname-test.sh carnine-rename.sh tests/carnine-rename-test.sh carnine-wlan.sh tests/carnine-wlan-test.sh carnine-password-check.sh carnine-password.sh tests/carnine-password-test.sh carnine-install-maps.sh tests/carnine-install-maps-test.sh ../../pack_maps.sh carnine-audio-output.sh tests/carnine-audio-output-test.sh carnine-cmdline.sh tests/carnine-cmdline-test.sh image-sbom.sh ../voice/package-deb.sh

      - name: carnine-hostname tests
        working-directory: resources/debos
        run: sh tests/carnine-hostname-test.sh

      - name: carnine-rename tests
        working-directory: resources/debos
        run: sh tests/carnine-rename-test.sh

      - name: carnine-wlan tests
        working-directory: resources/debos
        run: sh tests/carnine-wlan-test.sh

      - name: carnine-password tests
        working-directory: resources/debos
        run: sh tests/carnine-password-test.sh

      - name: carnine-install-maps tests
        working-directory: resources/debos
        run: sh tests/carnine-install-maps-test.sh

      - name: deploy_maps tests
        run: shellcheck deploy_maps.sh tests/deploy-maps-test.sh && sh tests/deploy-maps-test.sh

      - name: carnine-audio-output tests
        working-directory: resources/debos
        run: sh tests/carnine-audio-output-test.sh
      - name: carnine-cmdline tests
        working-directory: resources/debos
        run: sh tests/carnine-cmdline-test.sh

  user-guide:
    name: User guide PDF (pandoc, WeasyPrint)
    # docs/bedienung/pdf/README.md. The script fails on a page missing from
    # its page list and on a link inside the guide without a target. Only on
    # main: the guide is released from there, and the LFS checkout of its
    # pictures is not repeated for every branch and pull request, so a change
    # to the guide is checked with build.sh locally before its pull request.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # git describe for the version on the title page needs the tags.
          fetch-depth: 0
          # The pictures of the guide are in Git LFS (.gitattributes).
          lfs: true

      # The versions of Ubuntu 24.04 (pandoc 3.1.3, WeasyPrint 61.1), the same
      # the script is tested with on the developer machine.
      - name: Install pandoc and WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pandoc weasyprint fonts-dejavu-core

      - name: shellcheck
        run: shellcheck docs/bedienung/pdf/build.sh

      - name: Build the PDF
        run: docs/bedienung/pdf/build.sh

      - name: Upload the PDF
        uses: actions/upload-artifact@v7
        with:
          name: bedienungsanleitung
          path: build/bedienungsanleitung.pdf
          retention-days: 30

  sbom:
    name: SBOM and known vulnerabilities (syft, grype)
    # The bill of materials of our own dependencies, from Cargo.lock and the
    # versioned pubspec.lock (#41). The job fails only on a Critical finding
    # that has a fixed version; everything else is in the report. Accepted
    # findings go into .grype.yaml, each with its reason. The Debian packages
    # of the image are not covered here - that needs the image, not CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Pinned tool versions, like Flutter above: a new release must not turn
      # CI red on its own. The vulnerability database is always current.
      - uses: anchore/sbom-action/download-syft@v0.24.2
        id: syft
        with:
          syft-version: v1.52.0
      - uses: anchore/scan-action/download-grype@v7.4.2
        id: grype
        with:
          grype-version: v0.119.0
          cache-db: true

      - name: syft (CycloneDX and SPDX)
        run: |
          "${{ steps.syft.outputs.cmd }}" scan dir:src -q \
            -o cyclonedx-json=sbom.cdx.json \
            -o spdx-json=sbom.spdx.json
          jq '.components | length' sbom.cdx.json

      - name: grype report
        run: |
          "${{ steps.grype.outputs.cmd }}" sbom:sbom.cdx.json -q -o table
          "${{ steps.grype.outputs.cmd }}" sbom:sbom.cdx.json -q -o json --file grype.json

      - name: grype gate (Critical with a fix)
        run: '"${{ steps.grype.outputs.cmd }}" sbom:sbom.cdx.json -q --only-fixed --fail-on critical -o table'

      - name: Upload SBOM and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            sbom.cdx.json
            sbom.spdx.json
            grype.json
          retention-days: 30

  backend-arm64:
    name: Backend release build (arm64, Raspberry Pi target)
    # Native arm64 runner, free for public repositories - no cross toolchain
    # and no QEMU. This is the architecture the Pi actually runs.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y protobuf-compiler libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/backend
          key: arm64

      - name: cargo build --release
        working-directory: src/backend
        run: cargo build --release

      - name: Upload backend binary
        uses: actions/upload-artifact@v7
        with:
          name: carnine-backend-arm64
          path: src/backend/target/release/carnine-backend
          # Short retention: this is a build check, not a release channel.
          retention-days: 7
