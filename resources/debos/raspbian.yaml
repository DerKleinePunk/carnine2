{{- $rootpassword := or .rootpassword "raspberry" -}}
{{- $target_hostname := or .target_hostname "carnine-pc" -}}
{{- $display := or .display "auto" -}}
{{- $version := or .version "unknown" -}}
{{- $ssh_public_key := or .ssh_public_key "" -}}
{{- $default_image := "raspbian.img" -}}
{{- if eq $display "waveshare-1024x600" -}}
{{- $default_image = "raspbian-1024x600.img" -}}
{{- end -}}
{{- $image := or .image $default_image -}}

architecture: arm64

actions:
  - action: run
    description: Validate Waveshare SSH build key
    chroot: false
    command: |
      {{ if eq $display "waveshare-1024x600" -}}
      test -n '{{ $ssh_public_key }}' || {
        echo 'ERROR: Waveshare builds require -t ssh_public_key:<public-key>' >&2
        exit 1
      }
      printf '%s\n' '{{ $ssh_public_key }}' | grep -Eq '^(ssh-(ed25519|rsa)|ecdsa-sha2-nistp256) [A-Za-z0-9+/=]+( .*)?$' || {
        echo 'ERROR: ssh_public_key is not a supported OpenSSH public key' >&2
        exit 1
      }
      {{- else }}
      true
      {{- end }}

  - action: download
    description: Download RPi key ring
    url: https://archive.raspberrypi.org/debian/pool/main/r/raspberrypi-archive-keyring/raspberrypi-archive-keyring_2025.1+rpt1_all.deb
    name: raspberrypi-archive-keyring
    sha256sum: 2e727149d7acb8cc7f604e66d0049161039c8aa1eaf1175e54f9e69d963d60e4

  - action: download
    description: Download RPi config.txt
    url: https://raw.githubusercontent.com/RPi-Distro/pi-gen/ca5eb625d8892212838c4b3b972d9e7e03bfcb29/stage1/00-boot-files/files/config.txt
    name: raspberrypi-config.txt
    sha256sum: ea82a637facdcde1dc82ad343de14da4684673cb07deca9f5e0c15abfb6b2eb7

  - action: debootstrap
    description: Bootstrap Debian minbase
    suite: trixie
    components:
      - main
      - non-free
      - non-free-firmware
    mirror: http://deb.debian.org/debian
    variant: minbase

  - action: install-deb
    description: Install RPi key ring
    origin: raspberrypi-archive-keyring
    recommends: false
    unauthenticated: false
    update: false

  - action: run
    description: Add RPi apt repo
    chroot: true
    command: echo deb [signed-by=/usr/share/keyrings/raspberrypi-archive-keyring.gpg] http://archive.raspberrypi.com/debian/ trixie main >> /etc/apt/sources.list

  - action: run
    description: Add security apt repo
    chroot: true
    command: echo deb http://deb.debian.org/debian-security/ trixie-security main contrib non-free non-free-firmware >> /etc/apt/sources.list

  - action: run
    description: Add updates apt repo
    chroot: true
    command: echo deb http://deb.debian.org/debian trixie-updates main contrib non-free non-free-firmware >> /etc/apt/sources.list

  - action: run
    description: Update packages due to security and updates repo adds
    chroot: true
    command: apt-get update && apt-get -y dist-upgrade

  - action: apt
    description: Install packages
    packages:
      - adduser
      - avahi-daemon
      - bluez
      - bluez-firmware
      - dbus-user-session
      - dracut
      - firmware-brcm80211
      - iproute2
      - libasound2t64
      - libnss-mdns
      - parted
      - netbase
      - openssh-server
      - polkitd
      - raspi-firmware
      - rfkill
      - rpi.gpio-common
      - sudo
      - systemd-resolved
      - systemd-timesyncd
      - vim
      - nano
      - dialog
      - ffmpeg
      - fontconfig
      - fonts-liberation
      - i2c-tools
      - pulseaudio-utils
      - alsa-utils
      - udisks2
      - plymouth
      - plymouth-themes
      - zstd

  - action: run
    description: Defer automatic Dracut kernel hook
    chroot: true
    command: mv /etc/kernel/postinst.d/dracut /etc/kernel/postinst.d/dracut.disabled

  - action: apt
    description: Install RPi kernel packages
    packages:
      - linux-image-rpi-2712
      - linux-image-rpi-v8

  - action: run
    description: Restore automatic Dracut kernel hook
    chroot: true
    command: mv /etc/kernel/postinst.d/dracut.disabled /etc/kernel/postinst.d/dracut

  - action: run
    description: Reduce boot-time storage I/O
    chroot: true
    command: |
      install -d /etc/systemd/journald.conf.d
      printf '%s\n' '[Journal]' 'Storage=volatile' > /etc/systemd/journald.conf.d/volatile.conf

      install -d /etc/systemd/system
      for unit in dpkg-db-backup.service dpkg-db-backup.timer e2scrub_all.service e2scrub_all.timer e2scrub_reap.service; do
        ln -sf /dev/null "/etc/systemd/system/$unit"
      done

  - action: run
    description: Configure readable MUSIK USB volumes
    chroot: true
    command: |
      install -d -m 0755 /media/root
      install -d /etc/udisks2
      cat > /etc/udisks2/mount_options.conf << __EOF__
      [/dev/disk/by-label/MUSIK]
      vfat_defaults=uid=100,gid=104,umask=022
      vfat_allow=uid=100,gid=104,umask
      __EOF__
      install -d /etc/polkit-1/rules.d
      cat > /etc/polkit-1/rules.d/50-carnine-udisks.rules << __EOF__
      polkit.addRule(function(action, subject) {
        if (subject.user == "carnine" &&
            (action.id == "org.freedesktop.udisks2.filesystem-mount" ||
             action.id == "org.freedesktop.udisks2.filesystem-mount-system" ||
             action.id == "org.freedesktop.udisks2.filesystem-mount-other-seat")) {
          return polkit.Result.YES;
        }
      });
      __EOF__

  - action: overlay
    description: Install first-boot root filesystem expansion service
    origin: recipe
    source: expand-rootfs.service
    destination: /etc/systemd/system/expand-rootfs.service

  - action: overlay
    description: Install first-boot root filesystem expansion script
    origin: recipe
    source: expand-rootfs.sh
    destination: /usr/local/sbin/expand-rootfs

  - action: run
    description: Enable first-boot root filesystem expansion
    chroot: true
    command: |
      chmod 0755 /usr/local/sbin/expand-rootfs
      systemctl enable expand-rootfs.service

  - action: run
    description: Install RPi bootloader files
    chroot: false
    command: sh -c "cp ${ROOTDIR}/usr/lib/raspi-firmware/* ${ROOTDIR}/boot/firmware/"

  - action: overlay
    description: Copy config.txt
    origin: raspberrypi-config.txt
    destination: /boot/firmware/config.txt

  - action: run
    description: Enable I2C and hide the firmware rainbow splash
    chroot: true
    # Angehaengt unter dem [all]-Abschnitt, mit dem die pi-gen-config.txt
    # endet. disable_splash=1 blendet den Regenbogen der Firmware aus; der
    # Carnine-Splash per Plymouth weiter unten bleibt (#27).
    command: |
      sed -i '/^[[:space:]]*#\?[[:space:]]*dtparam=i2c_arm=/d' /boot/firmware/config.txt
      sed -i '/^[[:space:]]*#\?[[:space:]]*disable_splash=/d' /boot/firmware/config.txt
      printf '%s\n' 'dtparam=i2c_arm=on' 'disable_splash=1' >> /boot/firmware/config.txt

  # Das Waveshare-Panel laeuft unter Full KMS (vc4-kms-v3d aus der
  # pi-gen-config.txt). Sein EDID ist geklont und traegt ungerade
  # 1024x600-Timings (hsync_start 1029), die der vc4-Treiber ablehnt - er
  # faellt dann auf 1920x1080 aus dem CEA-Block zurueck und das Panel skaliert
  # selbst herunter. Statt auf fkms auszuweichen schieben wir ein korrigiertes
  # EDID unter (Kernel-Parameter in cmdline.txt weiter unten).
  # Begruendung und Gegenproben: docs/22-waveshare-display-1024x600.md

  # overlay kopiert eine einzelne Datei nur in ein vorhandenes Verzeichnis,
  # und das Debian-Rootfs hat kein /lib/firmware/edid.
  - action: run
    description: Create the EDID firmware directory
    chroot: true
    command: install -d /lib/firmware/edid

  - action: overlay
    description: Install corrected EDID for the Waveshare 1024x600 panel
    origin: recipe
    source: edid/waveshare-1024x600.bin
    destination: /lib/firmware/edid/waveshare-1024x600.bin

  # Dracut zieht vc4.ko in die Initramfs (fuer den Plymouth-Splash), also
  # fordert der Treiber das EDID schon dort an - lange bevor das Rootfs
  # gemountet ist. Ohne diesen Eintrag schlaegt der Firmware-Load mit -ENOENT
  # fehl und das Panel laeuft bis zum Rootfs-Switch im Fallback-Modus.
  - action: run
    description: Ship the EDID inside the initramfs as well
    chroot: true
    command: |
      install -d /etc/dracut.conf.d
      printf '%s\n' 'install_items+=" /usr/lib/firmware/edid/waveshare-1024x600.bin "' \
        > /etc/dracut.conf.d/carnine-edid.conf

  - action: run
    description: Set up cmdline.txt
    chroot: true
    command: |
      printf '%s' 'root=LABEL=ROOTFS quiet splash logo.nologo' > /boot/firmware/cmdline.txt
      {{ if eq $display "waveshare-1024x600" -}}
      printf '%s' ' drm.edid_firmware=HDMI-A-1:edid/waveshare-1024x600.bin' >> /boot/firmware/cmdline.txt
      {{- end }}
      printf '%s\n' ' vt.global_cursor_default=1' >> /boot/firmware/cmdline.txt

  - action: run
    description: Set up user/password
    chroot: true
    command: |
      adduser --gecos "Raspberry Pi User" --disabled-password --shell /bin/bash pi
      adduser pi sudo
      adduser pi audio
      echo pi:{{ $rootpassword }} | chpasswd
      {{ if $ssh_public_key -}}
      install -d -o pi -g pi -m 0700 /home/pi/.ssh
      printf '%s\n' '{{ $ssh_public_key }}' > /home/pi/.ssh/authorized_keys
      chown pi:pi /home/pi/.ssh/authorized_keys
      chmod 0600 /home/pi/.ssh/authorized_keys
      {{- end }}

      addgroup --system carnine
      adduser --system --ingroup carnine --no-create-home --home /nonexistent --shell /usr/sbin/nologin carnine
      adduser carnine audio
      adduser carnine render
      adduser carnine video
      adduser carnine input

      install -d -o carnine -g carnine -m 0750 /var/lib/carnine
      install -d -o carnine -g carnine -m 0750 /var/lib/carnine/media
      install -d -o carnine -g carnine -m 0750 /var/log/carnine
      install -d -o root -g carnine -m 0770 /etc/carnine

      install -d -o root -g root -m 0755 /usr/share/plymouth/themes/pix

  - action: overlay
    description: Install SSH host key generator
    origin: recipe
    source: ssh-hostkeys.service
    destination: /etc/systemd/system/carnine-ssh-hostkeys.service

  - action: overlay
    description: Install Carnine runtime configuration
    origin: recipe
    source: ../config/carnine.toml
    destination: /etc/carnine/config.toml

  - action: overlay
    description: Install Carnine configuration drop-ins (map setup)
    origin: recipe
    source: ../config/config.d
    destination: /etc/carnine/config.d

  - action: run
    description: Set Carnine configuration permissions
    chroot: true
    command: |
      chown root:carnine /etc/carnine/config.toml
      chmod 0660 /etc/carnine/config.toml
      chown -R root:carnine /etc/carnine/config.d
      chmod 0750 /etc/carnine/config.d
      chmod 0640 /etc/carnine/config.d/*.toml

  - action: install-deb
    description: Install Carnine backend
    origin: recipe
    packages:
      - carnine-backend.deb

  - action: install-deb
    description: Install Carnine Flutter frontend
    origin: recipe
    packages:
      - carnine-frontend.deb

  - action: install-deb
    description: Install Valhalla routing (ADR-021)
    origin: recipe
    packages:
      - carnine-valhalla.deb

  - action: run
    description: Create the map data directories deploy_maps.sh fills
    chroot: true
    command: |
      install -d -o carnine -g carnine -m 0750 /var/lib/carnine/maps
      install -d -o root -g root -m 0755 /var/lib/valhalla

  - action: run
    description: Enable a permanent debug console on tty2
    chroot: true
    command: systemctl enable getty@tty2.service

  - action: overlay
    description: Install Bootimage
    origin: recipe
    source: ../images/rund.png
    destination: /usr/share/plymouth/themes/pix/splash.png

  - action: overlay
    description: Install Bootimage Script
    origin: recipe
    source: theme-pix/pix.script
    destination: /usr/share/plymouth/themes/pix/pix.script

  - action: overlay
    description: Install Bootimage plymouth
    origin: recipe
    source: theme-pix/pix.plymouth
    destination: /usr/share/plymouth/themes/pix/pix.plymouth

  - action: run
    description: Set Plymouth version
    chroot: true
    command: sed -i 's/@CARNINE_VERSION@/{{ $version }}/g' /usr/share/plymouth/themes/pix/pix.script

  - action: run
    description: Config plymouth
    chroot: true
    command: |
      install -d /etc/dracut.conf.d
      printf '%s\n' \
        'add_dracutmodules+=" plymouth "' \
        'install_items+=" /etc/plymouth/plymouthd.conf "' \
        'install_items+=" /etc/alternatives/default.plymouth "' \
        'install_items+=" /usr/share/plymouth/themes/pix/pix.plymouth "' \
        'install_items+=" /usr/share/plymouth/themes/pix/pix.script "' \
        'install_items+=" /usr/share/plymouth/themes/pix/splash.png "' \
        > /etc/dracut.conf.d/plymouth.conf
      printf '%s\n' '[Daemon]' 'ThemeDir=/usr/share/plymouth/themes' 'Theme=pix' > /etc/plymouth/plymouthd.conf
      ln -sf /usr/share/plymouth/themes/pix/pix.plymouth /etc/alternatives/default.plymouth
      ln -sf /etc/alternatives/default.plymouth /usr/share/plymouth/themes/default.plymouth
      chmod 0755 /usr/share/plymouth/themes/pix
      chmod 0644 /usr/share/plymouth/themes/pix/pix.plymouth
      chmod 0644 /usr/share/plymouth/themes/pix/pix.script
      chmod 0644 /usr/share/plymouth/themes/pix/splash.png
      dracut --regenerate-all --force

  - action: run
    description: Set up hostname
    chroot: true
    command: |
      echo {{ $target_hostname }} > /etc/hostname
      echo "127.0.1.1		{{ $target_hostname }}" >> "/etc/hosts"

  - action: run
    description: Setup network config
    chroot: true
    command: |
      mkdir -p /etc/systemd/network/
      cat > /etc/systemd/network/wired.network << __EOF__
      [Match]
      Name=eth* en* end* wl* wlan*

      [Network]
      DHCP=yes
      __EOF__

      systemctl enable systemd-networkd
      systemctl enable systemd-resolved
      systemctl enable systemd-timesyncd
      systemctl enable avahi-daemon.service

      # Local time for the clock in the UI; logs stay in UTC. Another zone:
      # timedatectl set-timezone <Zone> on the device.
      ln -sf /usr/share/zoneinfo/Europe/Berlin /etc/localtime
      echo Europe/Berlin > /etc/timezone

  - action: run
    description: Drop SSH host keys
    chroot: true
    command: |
      rm -f /etc/ssh/ssh_host_*_key /etc/ssh/ssh_host_*_key.pub
      systemctl enable carnine-ssh-hostkeys.service
      systemctl enable ssh.service

  - action: run
    description: Ensure Carnine services are enabled
    chroot: true
    command: |
      systemctl enable carnine-backend.service
      systemctl enable carnine-frontend.service
      systemctl enable valhalla.service

  - action: run
    description: Force systemd first boot menchanism
    chroot: true
    command: echo uninitialized > /etc/machine-id

  - action: image-partition
    imagename: {{ $image }}
    imagesize: 3GiB
    partitiontype: msdos
    mountpoints:
      - mountpoint: /
        partition: ROOTFS
      - mountpoint: /boot/firmware
        partition: FIRMWARE
        options: [ auto ]
    partitions:
      - name: FIRMWARE
        fs: fat32
        flags: [ boot, lba ]
        start: 1MiB
        end: 256MiB
      - name: ROOTFS
        fs: ext4
        start: 256MiB
        end: 100%

  - action: filesystem-deploy
    description: Deploying filesystem onto image
    setup-fstab: true
    setup-kernel-cmdline: false

  - action: run
    description: Create block map file
    postprocess: true
    command: bmaptool create {{ $image }} > {{ $image }}.bmap

  - action: run
    description: Compressing final image
    postprocess: true
    command: gzip -f {{ $image }}
