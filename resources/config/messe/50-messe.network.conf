# Fixed address beside DHCP, for a laptop on a switch without a router
# (trade fair, Michael 2026-10-10): the laptop takes 192.168.77.1/24.
# Installed as /etc/systemd/network/wired.network.d/50-messe.conf on image
# devices (systemd-networkd); messe-einrichten.sh puts the device's own
# address in. carnine-pc .2, jeep-pi .3 (NetworkManager there, see nmcli).
[Network]
Address=@ADDRESS@/24
