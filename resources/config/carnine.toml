# Carnine backend runtime configuration
# Installed target path: /etc/carnine/config.toml

[server]
# Primary transport (ADR-002). Created by systemd's RuntimeDirectory in
# production (see carnine-backend.service); for local `cargo run`
# development, override with the CARNINE_SOCKET_PATH env var since a plain
# user account cannot create /run/carnine itself.
socket_path = "/run/carnine/carnine.sock"
# Optional TCP loopback fallback, left unset here on purpose - see
# docs/07-deployment.md §7.4. Enable only for local debugging where client
# and server do not share a kernel/socket namespace (e.g. a Windows-hosted
# Flutter debug build against a backend running inside WSL2), either via
# CARNINE_TCP_ADDRESS or a local, uncommitted copy of this file:
# tcp_address = "[::1]:50051"
# Socket permissions, octal. Unset means 0600 - only the carnine user itself.
# "0660" opens it to the carnine group; see docs/07-deployment.md §7.4 before
# using it, and prefer CARNINE_SOCKET_MODE via a systemd drop-in on a test
# device, since a deployment overwrites this file.
# socket_mode = "0660"

[media]
database_path = "/var/lib/carnine/media.sqlite3"
folders = ["/var/lib/carnine/media"]
supported_formats = ["mp3", "flac", "ogg"]
rescan_on_start = false
resume_mode = "restore_paused"
cover_cache_dir = "/var/lib/carnine/covers"

[audio]
navigation_interrupt = "pause_music"
# Where the volume is kept across restarts. The directory must exist and be
# writable by the backend; the image creates /var/lib/carnine (debos recipe),
# the package does not.
volume_state_path = "/var/lib/carnine/audio-volume"

[logging]
directory = "/var/log/carnine"
level = "info"

[system]
# Health sampling (CPU temperature, CPU utilisation, load average). Read from
# /sys and /proc, so a short cadence is cheap.
metrics_interval_seconds = 30
# Disk usage costs a statvfs per filesystem and moves slowly - keep it rare.
disk_metrics_interval_seconds = 300
# Filesystems to report. Left empty on purpose: the backend then probes the
# root filesystem plus every media folder above, deduplicated per filesystem,
# so a mounted MUSIK volume is picked up without touching this file.
disk_paths = []
# Overheating (#70): from warn on, every UI shows a warning that has to be
# confirmed; it ends only below clear, so it does not flicker around warn.
# The Pi 4 throttles at 80 °C. While at or above clear, the CPU values are
# sampled every warm_metrics_interval_seconds instead.
cpu_temperature_warn_celsius = 75.0
cpu_temperature_clear_celsius = 70.0
warm_metrics_interval_seconds = 5

# Navigation (ADR-021). Without this section there is no position source and
# routing points at the default Valhalla address below. On a device, put the
# real values in /etc/carnine/config.d/10-navigation.toml: deploy_pi.sh
# overwrites this file, the drop-ins survive (docs/07-deployment.md).
# [navigation]
# "none", "serial" (GPS mouse, NMEA on serial_device) or "replay" (recorded
# NMEA tour from replay_file, looped by default - for the trade fair stand).
# position_source = "replay"
# /dev/gps is the link the backend package's udev rule creates; serial_baud is
# the receiver's line speed (4800 is the NMEA standard, ignored on ttyACM).
# serial_device = "/dev/gps"
# serial_baud = 4800
# Set the system clock from the first valid fix while NTP has not synchronized
# it (no RTC, no network in the car). Only the serial source does this.
# set_system_clock = false
# Directory for recorded drives (raw NMEA of the serial source, one file per
# drive, usable as replay_file). Switched on and off over gRPC
# (NavigationService.SetTrackRecording, CLI: track-recording on|off); the
# switch is kept in the media database. Unset: recording unavailable.
# track_directory = "/var/lib/carnine/tracks"
# replay_file = "/var/lib/carnine/maps/GPS-Adnan-Tour.txt"
# replay_loop = true
# valhalla_url = "http://127.0.0.1:8002"
# map_region = "hessen"
# names_database = "/var/lib/carnine/maps/hessen_names.db"

# Car power supply AuPrV1_1 (docs/23-power-supply.md). Off by default. With a
# supply connected, the backend sends it a sign of life every second from
# start-up on; without one, its watchdog cuts the Pi off soon after booting.
# Switch it on in a drop-in such as /etc/carnine/config.d/20-power-supply.toml.
# [power_supply]
# enabled = true
# /dev/powersupply is the link the backend package's udev rule creates (uart5).
# device = "/dev/powersupply"
# baud = 38400

# Reversing camera (video grabber on the camera page). These are the defaults;
# what the settings page saves is kept in the media database and wins
# (CameraService; CLI: camera-settings, save-camera-settings, camera-devices).
# device is /dev/video<n> or a stable link under /dev/v4l/, norm "ntsc" or
# "pal", input the grabber's input (STK1160: 0-3 composite, 4 S-Video), width
# 360 or 720 (at 720 the STK1160 fills USB 2 and shows only about 10 frames/s).
# [camera]
# device = "/dev/video0"
# norm = "ntsc"
# input = 0
# width = 360

# The password "Beenden" in the options asks for (#51), as an Argon2id hash
# only; this one is the factory default. SystemService.SetExitPassword (CLI:
# set-exit-password) writes a changed one to
# /etc/carnine/config.d/30-exit-password.toml, which survives a deployment.
# Without a hash, or with one that cannot be read, the factory default applies.
[exit_password]
hash = "$argon2id$v=19$m=19456,t=2,p=1$Y2FybmluZS1leGl0LXB3$O+DjYmFGfVSWu+fkiM29V8Fv5Dy6eIQzW2q1WDqQXk0"

# Switches and sliders of the "Technik" page (ControlService; CLI: controls,
# control-states, set-control). One [[controls]] entry each, best in a drop-in
# such as /etc/carnine/config.d/40-controls.toml. Name every control after
# what hangs on it - the UI shows the name as it is. type is "switch" or
# "slider" (0-100); chip is "mcp23017" (switches only; bus /dev/i2c-1 and
# address 0x20 unless given, pin 0-7 = GPA0-7, 8-15 = GPB0-7) or "demo"
# (keeps what is set, for trying without hardware). restore = true brings the
# last value back at start-up; unset, sliders do and switches start off.
# reset_gpio = <BCM number> (gpio_chip /dev/gpiochip0 unless given) has the
# backend hold the chip's /RESET high, as Michael's IO board needs: a
# pull-down keeps the MCP23017 in reset otherwise, and puts it back there
# (all relays off) when the backend exits. A broken entry is skipped with an
# error in the log.
# [[controls]]
# id = "interior_light"
# name = "Innenlicht"
# type = "switch"
# chip = "mcp23017"
# address = 0x20
# pin = 0
# reset_gpio = 17
#
# chip "pwm" drives a hardware PWM channel of the Pi through sysfs: a slider
# sets the duty cycle, a switch full or nothing. The image enables both
# channels (dtoverlay=pwm-2chan): channel 0 is GPIO 18 (Pin 12), the "Sig" of
# the case fan at JP10 of the IO board; channel 1 is GPIO 19 (Pin 35).
# pwm_chip is /sys/class/pwm/pwmchip0 unless given, frequency 100 Hz (the fan
# stage switches slowly). Level 0 is off; the levels above spread over
# min_level..100 %, so min_level is where the fan still turns. kick_ms gives
# full duty for that long when it starts from off. The output stops when the
# backend exits.
# boost_on_overheat = true (any control) runs it at full (on, 100 %) while the
# CPU overheat warning is on ([system] cpu_temperature_warn_celsius) and puts
# its own value back once it clears (cpu_temperature_clear_celsius). A value
# set during the warning is kept for afterwards.
# [[controls]]
# id = "case_fan"
# name = "Gehäuselüfter"
# type = "slider"
# chip = "pwm"
# channel = 0
# min_level = 30
# kick_ms = 800
# boost_on_overheat = true

# The display backlight over PWM channel 1 (GPIO 19), only for a display
# modified for it (Waveshare 7H: a resistor out, its pad to GPIO 19). The
# options set it (SystemService Get/SetDisplayBrightness; CLI: brightness,
# set-brightness); it is not on the "Technik" page. frequency is 1000 Hz and
# min_percent 10 unless given: the lowest setting is 10 % duty, never dark.
# It starts at 100 % and keeps the last level; the backend leaves it on when
# it exits. Until the backend runs, the modified display stays dark.
# [display.backlight]
# channel = 1
